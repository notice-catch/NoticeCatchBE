name: Notice Catch CD

# main 브랜치에 push가 발생하면 실행
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 21 세팅 (Gradle 캐시 활성화)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Gradle 명령어 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 테스트를 제외하고 bootJar 빌드하기
      - name: Build with Gradle
        run: ./gradlew bootJar -x test

      # 5. JAR 파일명을 app.jar로 단일화하여 안전하게 복사
      - name: Rename JAR file
        run: |
          mkdir -p build/deploy
          cp build/libs/*[!plain].jar build/deploy/app.jar

      # 6. Docker 관련 파일 전송
      - name: Transfer Docker files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "infra/Dockerfile,infra/docker-compose-prod.yml"
          target: "/home/ubuntu/infra"
          strip_components: 1

      # 7. app.jar 파일만 EC2 target 경로(/home/ubuntu/infra/app.jar)로 전송
      - name: Transfer jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "build/deploy/app.jar"
          target: "/home/ubuntu/infra"
          strip_components: 2

      # 8. EC2 서버 접속 후 기존 컨테이너 완전 정지 및 재생성 (SSH)
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/infra
            
            # 기존 구동 중인 컨테이너 제거
            sudo docker compose -f docker-compose-prod.yml down --remove-orphans || true
            
            # 새 이미지 빌드 및 백그라운드 재실행
            sudo docker compose -f docker-compose-prod.yml up -d --build
            
            # 미사용 이미지 정리
            sudo docker image prune -f